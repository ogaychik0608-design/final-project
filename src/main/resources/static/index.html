<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore KZ — Главная</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6;
      font-family: 'Inter', sans-serif;
    }
    .product-card {
      background: white;
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important;
    }
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background-color: #fafafa;
      padding: 15px;
    }
    .btn-save {
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
    }
    .admin-bar {
      background: #212529;
      color: #fff;
      padding: 8px 0;
      font-size: 0.85rem;
      text-align: center;
    }
    .price-tag {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0d6efd;
    }
    .specs-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.8rem;
      color: #6c757d;
      border: 1px solid #f1f1f1;
      min-height: 50px;
    }
    .category-btn {
      border-radius: 20px;
      padding: 8px 20px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-remove-item {
      color: #dc3545;
      background: none;
      border: none;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0 5px;
      transition: opacity 0.2s;
    }
    .btn-remove-item:hover {
      opacity: 0.7;
    }
    /* Стили для активной пагинации */
    .page-link { border-radius: 8px; margin: 0 3px; color: #212529; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .page-item.active .page-link { background-color: #0d6efd; border-color: #0d6efd; }
  </style>
</head>
<body>

<div id="admin-bar" class="admin-bar" style="display: none;">🔧 Режим администратора активен</div>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">MyStore <span class="text-primary">KZ</span></a>

    <div class="flex-grow-1 mx-lg-5 mx-2">
      <div class="input-group">
        <input type="text" id="search-input" class="form-control border-end-0 shadow-none" placeholder="Поиск товаров..." style="border-radius: 10px 0 0 10px;">
        <button class="btn btn-outline-primary border-start-0" onclick="handleSearch()" style="border-radius: 0 10px 10px 0; border-color: #dee2e6;">🔍Поиск</button>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-dark btn-sm btn-save px-3" data-bs-toggle="modal" data-bs-target="#cartModal" onclick="loadCart()">
        🛒 <span id="cart-count" class="badge bg-danger" style="border-radius: 50%;">0</span>
      </button>

      <a href="add.html" id="add-btn" class="btn btn-success btn-sm btn-save px-3" style="display: none;">+ Добавить</a>
      <span id="user-name" class="fw-bold me-2 text-primary" style="display: none;"></span>
      <button id="login-btn" class="btn btn-primary btn-sm btn-save px-4" data-bs-toggle="modal" data-bs-target="#loginModal">Войти</button>
      <button id="logout-btn" class="btn btn-outline-danger btn-sm btn-save" style="display: none;" onclick="logout()">Выйти</button>
    </div>
  </div>
</nav>

<div class="container mb-4 text-center">
  <div id="category-bar" class="d-flex justify-content-center gap-2 flex-wrap">
    <button class="btn btn-primary category-btn" onclick="filterByCategory(null, this)">Все товары</button>
  </div>
</div>

<div class="container">
  <div id="products-grid" class="row row-cols-1 row-cols-md-3 g-4"></div>
</div>

<div class="container mt-5 mb-5">
  <nav>
    <ul id="pagination-ul" class="pagination justify-content-center"></ul>
  </nav>
</div>

<div class="modal fade" id="cartModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 p-4 shadow-lg" style="border-radius: 15px;">
      <div class="modal-header border-0">
        <h3 class="fw-bold">Корзина</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="cart-items-list">
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center">
          <span class="fw-bold">Итого:</span>
          <span class="price-tag" id="cart-total-price">0 ₸</span>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-primary w-100 btn-save py-3">Оформить заказ</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 p-4 shadow-lg" style="border-radius: 15px;"><div class="modal-body text-center"><h3 class="fw-bold mb-4">Вход</h3><input type="text" id="auth-user" class="form-control mb-3" style="border-radius: 10px;" placeholder="Логин"><input type="password" id="auth-pass" class="form-control mb-4" style="border-radius: 10px;" placeholder="Пароль"><button class="btn btn-primary w-100 btn-save py-3 mb-3" onclick="handleLogin()">Войти</button><p class="small">Нет аккаунта? <a href="#" data-bs-toggle="modal" data-bs-target="#regModal">Создать аккаунт</a></p></div></div></div></div>
<div class="modal fade" id="regModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 p-4 shadow-lg" style="border-radius: 15px;"><div class="modal-body text-center"><h3 class="fw-bold mb-4">Регистрация</h3><input type="text" id="reg-user" class="form-control mb-2" style="border-radius: 10px;" placeholder="Придумайте логин"><input type="email" id="reg-email" class="form-control mb-2" style="border-radius: 10px;" placeholder="Ваш Email"><input type="password" id="reg-pass" class="form-control mb-4" style="border-radius: 10px;" placeholder="Придумайте пароль"><button class="btn btn-success w-100 btn-save py-3" onclick="handleRegister()">Зарегистрироваться</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const userJson = localStorage.getItem('currentUser');
  const currentUser = userJson ? JSON.parse(userJson) : null;
  const isAdmin = currentUser && currentUser.role === 'ADMIN';

  let activeCategoryId = null;
  let searchQuery = "";

  // КОРЗИНА
  async function addToCart(productId) {
    if (!currentUser) {
      alert("Пожалуйста, войдите в систему!");
      new bootstrap.Modal(document.getElementById('loginModal')).show();
      return;
    }
    const res = await fetch(`/api/cart/add/${productId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentUser)
    });
    if (res.ok) {
      alert("Товар добавлен!");
      updateCartBadge();
    }
  }

  async function updateCartBadge() {
    if (!currentUser) return;
    const res = await fetch('/api/cart/get', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentUser)
    });
    const items = await res.json();
    const count = items.reduce((acc, item) => acc + item.quantity, 0);
    document.getElementById('cart-count').innerText = count;
  }

  async function deleteCartItem(cartItemId) {
    if (!confirm("Удалить этот товар из корзины?")) return;
    const res = await fetch(`/api/cart/remove/${cartItemId}`, { method: 'DELETE' });
    if (res.ok) { loadCart(); updateCartBadge(); }
  }

  async function loadCart() {
    if (!currentUser) return;
    const res = await fetch('/api/cart/get', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentUser)
    });
    const items = await res.json();
    const list = document.getElementById('cart-items-list');
    let total = 0;

    if (items.length === 0) {
      list.innerHTML = '<p class="text-center text-muted">Корзина пуста</p>';
    } else {
      list.innerHTML = items.map(item => {
        total += item.price * item.quantity;
        return `
          <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
            <div>
              <span class="fw-bold">${item.productName}</span>
              <span class="text-muted small mx-2">x${item.quantity}</span>
              <div class="small text-primary">${(item.price * item.quantity).toLocaleString()} ₸</div>
            </div>
            <button onclick="deleteCartItem(${item.id})" class="btn-remove-item" title="Удалить">&times;</button>
          </div>
        `;
      }).join('');
    }
    document.getElementById('cart-total-price').innerText = `${total.toLocaleString()} ₸`;
  }

  // АВТОРИЗАЦИЯ
  async function handleRegister() {
    const username = document.getElementById('reg-user').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-pass').value;
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    if (res.ok) { alert("Успешно!"); location.reload(); }
  }

  async function handleLogin() {
    const username = document.getElementById('auth-user').value;
    const password = document.getElementById('auth-pass').value;
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      const user = await res.json();
      localStorage.setItem('currentUser', JSON.stringify(user));
      location.reload();
    } else { alert("Неверный логин или пароль"); }
  }

  function logout() { localStorage.removeItem('currentUser'); location.reload(); }

  // ТОВАРЫ
  function handleSearch() {
    searchQuery = document.getElementById('search-input').value.trim();
    activeCategoryId = null;
    loadProducts(0);
  }

  async function loadCategories() {
    const res = await fetch('/api/products/categories');
    const categories = await res.json();
    const bar = document.getElementById('category-bar');
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = "btn btn-outline-primary category-btn";
      btn.innerText = cat.title;
      btn.onclick = () => filterByCategory(cat.id, btn);
      bar.appendChild(btn);
    });
  }

  function filterByCategory(id, element) {
    activeCategoryId = id;
    searchQuery = "";
    document.querySelectorAll('.category-btn').forEach(b => b.classList.replace('btn-primary', 'btn-outline-primary'));
    element.classList.replace('btn-outline-primary', 'btn-primary');
    loadProducts(0);
  }

  async function deleteProduct(id) {
    if (confirm("Удалить этот товар?")) {
      await fetch(`/api/products/${id}`, { method: 'DELETE' });
      loadProducts(0);
    }
  }

  async function loadProducts(page = 0) {
    if (currentUser) {
      document.getElementById('login-btn').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'block';
      document.getElementById('user-name').style.display = 'inline';
      document.getElementById('user-name').innerText = currentUser.username;
      updateCartBadge();
      if (isAdmin) {
        document.getElementById('admin-bar').style.display = 'block';
        document.getElementById('add-btn').style.display = 'block';
      }
    }

    let url = `/api/products?page=${page}&size=6`;
    if (activeCategoryId) url += `&categoryId=${activeCategoryId}`;
    else if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

    const res = await fetch(url);
    const data = await res.json();
    const grid = document.getElementById('products-grid');

    grid.innerHTML = data.content.map(p => `
      <div class="col">
        <div class="card product-card">
          <img src="${p.imageName ? '/images/products/' + p.imageName : 'https://placehold.co/400x300?text=MyStore+KZ'}" class="product-img">
          <div class="card-body p-4 d-flex flex-column">
            <h5 class="fw-bold">${p.name}</h5>
            <div class="specs-box mb-3">${p.specifications || 'Характеристики не указаны'}</div>
            <div class="mt-auto">
              <div class="price-tag mb-3">${p.price.toLocaleString()} ₸</div>
              ${isAdmin ? `
                <div class="btn-group w-100 shadow-sm overflow-hidden" style="border-radius:10px;">
                  <button onclick="window.location.href='add.html?id=${p.id}'" class="btn btn-warning py-2">Изменить</button>
                  <button onclick="deleteProduct(${p.id})" class="btn btn-danger py-2">Удалить</button>
                </div>
              ` : `
                <button onclick="addToCart(${p.id})" class="btn btn-dark w-100 btn-save py-2">В корзину</button>
              `}
            </div>
          </div>
        </div>
      </div>
    `).join('');

    renderPagination(data);
  }

  function renderPagination(data) {
    const paginationUl = document.getElementById('pagination-ul');
    paginationUl.innerHTML = '';
    if (data.totalPages <= 1) return;

    // Назад
    paginationUl.innerHTML += `
      <li class="page-item ${data.first ? 'disabled' : ''}">
        <button class="page-link" onclick="loadProducts(${data.number - 1})">←</button>
      </li>`;

    // Номера страниц
    for (let i = 0; i < data.totalPages; i++) {
      paginationUl.innerHTML += `
        <li class="page-item ${i === data.number ? 'active' : ''}">
          <button class="page-link" onclick="loadProducts(${i})">${i + 1}</button>
        </li>`;
    }

    // Вперед
    paginationUl.innerHTML += `
      <li class="page-item ${data.last ? 'disabled' : ''}">
        <button class="page-link" onclick="loadProducts(${data.number + 1})">→</button>
      </li>`;
  }

  loadCategories();
  loadProducts(0);
</script>
</body>
</html>
