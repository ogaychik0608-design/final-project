<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактирование — MyStore KZ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container mt-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 700px;">
    <h3 class="fw-bold mb-4"> Изменение товара</h3>
    <form id="editForm">
      <div class="mb-3">
        <label class="form-label">Название</label>
        <input type="text" id="name" class="form-control" required>
      </div>
      <div class="row mb-3">
        <div class="col"><label class="form-label">Цена</label><input type="number" id="price" class="form-control"></div>
        <div class="col"><label class="form-label">Страна</label><input type="text" id="originCountry" class="form-control"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Описание</label>
        <textarea id="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label">Характеристики</label>
        <textarea id="specifications" class="form-control" rows="2"></textarea>
      </div>
      <div class="d-flex justify-content-between">
        <a href="index.html" class="btn btn-secondary">Назад</a>
        <button type="submit" class="btn btn-primary px-4">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script>
  const id = new URLSearchParams(window.location.search).get('id');

  async function loadData() {
    const res = await fetch('/api/products/' + id);
    const p = await res.json();
    document.getElementById('name').value = p.name;
    document.getElementById('price').value = p.price;
    document.getElementById('originCountry').value = p.originCountry;
    document.getElementById('description').value = p.description || '';
    document.getElementById('specifications').value = p.specifications || '';
  }

  document.getElementById('editForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
      name: document.getElementById('name').value,
      price: document.getElementById('price').value,
      originCountry: document.getElementById('originCountry').value,
      description: document.getElementById('description').value,
      specifications: document.getElementById('specifications').value
    };
    await fetch('/api/products/' + id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    window.location.href = 'index.html';
  };
  loadData();
</script>
</body>
</html>
